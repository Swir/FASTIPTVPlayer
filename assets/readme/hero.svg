<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">FastIPTV Player — SWIR playlist and EPG desktop player</title><desc id="desc">Dark electric-cyan banner for FastIPTV Player, a local and authorized M3U/M3U8 playlist browser with XMLTV guide and VLC playback.</desc>
